<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="Graph of leitmotifs in Undertale and Deltarune's soundtracks">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Undertale/Deltarune Leitmotifs | edenculver.net</title>
	<link rel="icon" type="image/x-icon" href="/icon/favicon.ico">
	<link rel="stylesheet" href="styles.css">
	<script src="https://unpkg.com/d3-force-boundary@0.0.1/dist/d3-force-boundary.min.js"></script>
	<script src="script.js" type="module"></script>
</head>
<body>
	<div id="container">
		<div id="header">
			<a href="/home">
				<img class="icon" src="/icon/icon.svg" alt="Home">
			</a>
			<h1>Undertale/Deltarune Leitmotifs Graph</h1>
			<div class="icon"></div>
		</div>
		<div id="container_bottom">
			<div id="container_bottom_left">
				<h2 id="selected_name"></h2>
				<i id="selected_caption"></i>
				<div id="selected_media" hidden></div>
				<p id="selected_list_name"></p>
				<div id="selected_list"></div>
				<div id="selects">
					<table>
						<tr>
							<td>
								<label for="select_leitmotif">Leitmotif:</label>
							</td>
							<td>
								<select id="select_leitmotif">
									<option data-option="x">---</option>
								</select>
							</td>
						</tr>
						<tr>
							<td>
								<label for="select_song">Song:</label>
							</td>
							<td>
								<select id="select_song">
									<option data-option="x">---</option>
								</select>
							</td>
						</tr>
					</table>
				</div>
			</div>
			<div id="container_bottom_right">
				<svg id="canvas"></svg>
				<div id="footer">
					<span><svg class="legend"><rect class="legend g0"></rect></svg>UNDERTALE</span>
					<span><svg class="legend"><rect class="legend g1"></rect></svg>DELTARUNE Ch. 1</span>
					<span><svg class="legend"><rect class="legend g2"></rect></svg>DELTARUNE Ch. 2</span>
					<span><svg class="legend"><rect class="legend g3"></rect></svg>DELTARUNE Ch. 3</span>
					<span><svg class="legend"><rect class="legend g4"></rect></svg>DELTARUNE Ch. 4</span>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
